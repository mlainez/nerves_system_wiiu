#
# Firmware metadata + partition layout for the Nintendo Wii U
#
# These can be overridden with environment variables of the same name.
#   Run 'fwup -m' to query values in a .fw file.
#   Use 'fw_printenv' to query values on the target.

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "wiiu")
define(NERVES_FW_ARCHITECTURE, "powerpc")
define(NERVES_FW_AUTHOR, "Marc Lainez")

define(NERVES_FW_DEVPATH, "/dev/mmcblk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p3") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/data")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default rootfs path if not overridden on the fwup command line.
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# This produces an MBR with the following layout. The Wii U's SD driver
# (Aroma cold-boot) and linux-loader both read "the first FAT partition"
# (MBR entry 0) for fw.img + the kernel + the boot config, and the kernel
# mounts root from MBR entry 1. fwup flips the whole layout between A and B by
# writing mbr-a / mbr-b, so entry 0/entry 1 always point at the active slot —
# the same trick nerves_system_rpi* uses for its no-U-Boot A/B.
#
# +----------------------------+
# | MBR                        |
# +----------------------------+
# | Firmware config data       |
# | (formatted as uboot env)   |
# +----------------------------+
# | p0*: Boot A (FAT32)        |  fw.img, /linux/dtbImage.wiiu, boot.cfg,
# |                            |  petitboot.conf, wiiu/ (Aroma overlay)
# +----------------------------+
# | p0*: Boot B (FAT32)        |
# +----------------------------+
# | p1*: Rootfs A (squashfs)   |
# +----------------------------+
# | p1*: Rootfs B (squashfs)   |
# +----------------------------+
# | p2 : Application (f2fs)    |  -> /data
# +----------------------------+
#
# p0/p1 always resolve to the active slot. Sizes are in 512-byte blocks.

define(UBOOT_ENV_OFFSET, 16)
define(UBOOT_ENV_COUNT, 16)  # 8 KB

# Boot partitions: 128 MiB each. They hold fw.img (~256 KB), the kernel
# (~6 MB) and the ~41 MB Aroma boot overlay, with room to grow.
define(BOOT_A_PART_OFFSET, 2048)
define(BOOT_A_PART_COUNT, 262144)
define-eval(BOOT_B_PART_OFFSET, "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")
define(BOOT_B_PART_COUNT, ${BOOT_A_PART_COUNT})

# Rootfs partitions: 256 MiB each (squashfs root, lots of headroom for BEAM).
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 524288)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application data partition. Occupies the rest of the card (expand=true).
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

mbr mbr-a {
    partition 0 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = 0xc # FAT32
        boot = true
    }
    partition 1 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83 # Linux
    }
    partition 2 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0x83 # Linux
        expand = true
    }
    # partition 3 is unused
}

mbr mbr-b {
    partition 0 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = 0xc # FAT32
        boot = true
    }
    partition 1 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83 # Linux
    }
    partition 2 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0x83 # Linux
        expand = true
    }
    # partition 3 is unused
}

# Location where installed firmware information is stored. While this is called
# "u-boot", u-boot isn't involved on the Wii U — it's just a convenient
# key/value store that fwup and Nerves runtime libraries already understand.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}
