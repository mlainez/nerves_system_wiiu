# Post-installation firmware operations for the Nintendo Wii U
#
# Tasks:
#  * `factory-reset`  - Clear the writable app partition; re-initialized next boot.
#  * `prevent-revert` - Prevent `revert` until the next firmware update.
#  * `revert`         - Boot the previous firmware (if it's still intact).
#  * `validate`       - Mark the running firmware as good.
#  * `status`         - Print the active partition (`a` or `b`).
#
# These run on the device against /dev/mmcblk0. They're compiled into
# /usr/share/fwup/ops.fw by post-build.sh. Usage on the target:
#   fwup -t <task> -d /dev/rootdisk0 --enable-trim /usr/share/fwup/ops.fw

require-fwup-version="1.0.0"

include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")

# Clear the application data partition so it's reformatted on next boot.
task factory-reset {
    on-init {
        info("Erasing the application data partition")
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

# Prevent reverting to the firmware in the inactive slot.
task prevent-revert.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init {
        info("Preventing revert to partition B")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")
    }
}
task prevent-revert.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init {
        info("Preventing revert to partition A")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")
    }
}
task prevent-revert {
    on-init { error("Error detecting active partition") }
}

# Revert to the firmware in the inactive slot.
task revert.a {
    # Currently running B; revert to A (which must still be valid).
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        info("Reverting to partition A")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        mbr_write(mbr-a)
    }
}
task revert.b {
    # Currently running A; revert to B.
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        info("Reverting to partition B")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        mbr_write(mbr-b)
    }
}
task revert {
    on-init {
        error("Nothing to revert to or the inactive partition is invalid.")
    }
}

# Mark the running firmware good. (No automatic rollback is wired on the Wii U,
# so this is a no-op kept for API compatibility with Nerves tooling.)
task validate.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("Firmware on partition A validated") }
}
task validate.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("Firmware on partition B validated") }
}
task validate {
    on-init { error("Error detecting active partition") }
}

# Print the active partition.
task status.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("a") }
}
task status.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("b") }
}
task status {
    on-init { error("unknown") }
}
